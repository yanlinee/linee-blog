{{- $language := . -}}
{{- if eq $language "zh-cn" -}}
<svg class="language-flag-svg" viewBox="0 0 36 26" role="img" aria-label="中国国旗">
    <rect width="36" height="26" rx="4" fill="#ee1c25" />
    <path fill="#ffde00" d="M8 4.1 9 7.2h3.3L9.6 9.1l1 3.1L8 10.3l-2.6 1.9 1-3.1-2.7-1.9H7L8 4.1Z" />
    <circle cx="14.3" cy="4.8" r="1.05" fill="#ffde00" />
    <circle cx="16.6" cy="8" r="1.05" fill="#ffde00" />
    <circle cx="16.2" cy="12" r="1.05" fill="#ffde00" />
    <circle cx="13.5" cy="14.4" r="1.05" fill="#ffde00" />
</svg>
{{- else if eq $language "en" -}}
<svg class="language-flag-svg" viewBox="0 0 36 26" role="img" aria-label="英国国旗">
    <g>
        <rect width="36" height="26" fill="#21468b" />
        <path d="M0 0 36 26M36 0 0 26" stroke="#fff" stroke-width="6" />
        <path d="M0 0 36 26M36 0 0 26" stroke="#cf142b" stroke-width="2.6" />
        <path d="M18 0v26M0 13h36" stroke="#fff" stroke-width="8" />
        <path d="M18 0v26M0 13h36" stroke="#cf142b" stroke-width="4.6" />
    </g>
    <rect x=".5" y=".5" width="35" height="25" rx="3.5" fill="none" stroke="rgba(0,0,0,.16)" />
</svg>
{{- else -}}
<svg class="language-flag-svg" viewBox="0 0 36 26" role="img" aria-label="Language">
    <rect width="36" height="26" rx="4" fill="#e8eef7" />
    <circle cx="18" cy="13" r="8" fill="none" stroke="#52657d" stroke-width="1.6" />
    <path d="M10 13h16M18 5c3.8 4.3 3.8 11.7 0 16M18 5c-3.8 4.3-3.8 11.7 0 16" fill="none" stroke="#52657d" stroke-width="1.3" />
</svg>
{{- end -}}
