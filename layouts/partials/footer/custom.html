<script>
    (() => {
        if (window.__lineeSiteBooted) return;
        window.__lineeSiteBooted = true;

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const siteRoot = new URL('{{ .Site.BaseURL | safeJS }}', window.location.href);
        const motionLevel = '{{ .Site.Params.motion.level | default "normal" }}';
        const motionProfiles = {
            off: { enableNetwork: false },
            ambient: {
                enableNetwork: true,
                pointCountScale: 1.15,
                offsetFactor: 0.018,
                linkDistance: 170,
                linkAlpha: 0.52,
                lineWidth: 0.9,
                pointAlpha: 0.62,
                pointRadius: 1.2
            },
            subtle: {
                enableNetwork: true,
                pointCountScale: 0.7,
                offsetFactor: 0.02,
                linkDistance: 145,
                linkAlpha: 0.4,
                lineWidth: 1,
                pointAlpha: 0.38,
                pointRadius: 1.4
            },
            normal: {
                enableNetwork: true,
                pointCountScale: 1,
                offsetFactor: 0.035,
                linkDistance: 170,
                linkAlpha: 0.55,
                lineWidth: 1.1,
                pointAlpha: 0.5,
                pointRadius: 1.8
            },
            strong: {
                enableNetwork: true,
                pointCountScale: 1.2,
                offsetFactor: 0.05,
                linkDistance: 190,
                linkAlpha: 0.68,
                lineWidth: 1.2,
                pointAlpha: 0.6,
                pointRadius: 2.1
            }
        };
        const motionProfile = motionProfiles[motionLevel] || motionProfiles.normal;
        const pageCache = new Map();
        const searchCache = new Map();
        let visitCountRequest = null;
        let pageController = null;
        let navigationSequence = 0;

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const currentLanguage = () => document.documentElement.lang.toLowerCase().startsWith('zh') ? 'zh-cn' : 'en';

        const closeMobileDrawer = () => {
            const trigger = document.querySelector('.top-nav-mobile-trigger');
            const drawer = document.getElementById('top-nav-drawer');
            document.body.classList.remove('top-nav-drawer-open');
            if (trigger) trigger.setAttribute('aria-expanded', 'false');
            if (drawer) drawer.setAttribute('aria-hidden', 'true');
        };

        const setLanguageOpen = (switcher, open, focusFirst = false) => {
            if (!switcher) return;
            const trigger = switcher.querySelector('.language-switcher-trigger');
            const menu = switcher.querySelector('.language-switcher-menu');
            const options = Array.from(switcher.querySelectorAll('.language-switcher-option'));
            if (!trigger || !menu) return;

            window.clearTimeout(switcher.__languageCloseTimer);
            trigger.setAttribute('aria-expanded', open ? 'true' : 'false');

            if (open) {
                document.querySelectorAll('[data-language-switcher].is-open').forEach((other) => {
                    if (other !== switcher) setLanguageOpen(other, false);
                });
                menu.hidden = false;
                requestAnimationFrame(() => {
                    switcher.classList.add('is-open');
                    if (focusFirst && options.length) options[0].focus();
                });
                return;
            }

            switcher.classList.remove('is-open');
            switcher.__languageCloseTimer = window.setTimeout(() => {
                if (!switcher.classList.contains('is-open')) menu.hidden = true;
            }, 170);
        };

        const closeLanguageMenus = () => {
            document.querySelectorAll('[data-language-switcher].is-open').forEach((switcher) => setLanguageOpen(switcher, false));
        };

        const bindSoftThemeToggle = () => {
            const toggle = document.getElementById('dark-mode-toggle');
            if (!toggle || toggle.dataset.softThemeBound === 'true') return;
            toggle.dataset.softThemeBound = 'true';
            toggle.addEventListener('click', () => {
                const next = document.documentElement.dataset.scheme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.scheme = next;
                localStorage.setItem('StackColorScheme', next);
                window.dispatchEvent(new CustomEvent('onColorSchemeChange', { detail: next }));
            });
        };

        const initOutline = (signal) => {
            const outlineNav = document.getElementById('ArticleOutlineNav');
            if (!outlineNav) return;
            const links = Array.from(outlineNav.querySelectorAll('a[href^="#"]'));
            if (!links.length) return;

            const toId = (href) => decodeURIComponent((href || '').replace(/^#/, ''));
            const linkById = new Map(links.map((link) => [toId(link.getAttribute('href')), link]));
            const headings = Array.from(document.querySelectorAll('.article-content h1[id], .article-content h2[id], .article-content h3[id], .article-content h4[id], .article-content h5[id], .article-content h6[id]'))
                .filter((heading) => linkById.has(heading.id));
            if (!headings.length) return;

            const outlineBox = outlineNav.closest('.left-outline-block');
            let activeId = '';
            let ticking = false;

            const setActive = (id) => {
                if (!id || id === activeId) return;
                activeId = id;
                links.forEach((link) => {
                    const isActive = toId(link.getAttribute('href')) === id;
                    link.classList.toggle('is-active', isActive);
                    const item = link.closest('li');
                    if (item) {
                        item.classList.toggle('active', isActive);
                        item.classList.remove('active-parent');
                    }
                });
                const activeLink = linkById.get(id);
                if (!activeLink) return;
                let currentItem = activeLink.closest('li');
                while (currentItem) {
                    currentItem.classList.add('active-parent');
                    const parentList = currentItem.parentElement;
                    currentItem = parentList ? parentList.closest('li') : null;
                }
                if (outlineBox) {
                    const top = activeLink.offsetTop;
                    const bottom = top + activeLink.offsetHeight;
                    if (top < outlineBox.scrollTop + 24 || bottom > outlineBox.scrollTop + outlineBox.clientHeight - 24) {
                        outlineBox.scrollTo({
                            top: Math.max(0, top - outlineBox.clientHeight * 0.35),
                            behavior: reducedMotion ? 'auto' : 'smooth'
                        });
                    }
                }
            };

            const update = () => {
                const scanLine = window.scrollY + 170;
                let current = headings[0].id;
                for (const heading of headings) {
                    if (heading.offsetTop <= scanLine) current = heading.id;
                    else break;
                }
                setActive(current);
            };

            const onScroll = () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    update();
                    ticking = false;
                });
            };

            window.addEventListener('scroll', onScroll, { passive: true, signal });
            window.addEventListener('resize', onScroll, { passive: true, signal });
            update();
        };

        const initReadingTools = (signal) => {
            const progress = document.querySelector('[data-reading-progress]');
            const progressBar = document.querySelector('[data-reading-progress-bar]');
            const backToTop = document.querySelector('[data-back-to-top]');
            const article = document.querySelector('.article-page .main-article:not(.profile-content-card) .article-content');
            let ticking = false;
            if (progress) progress.hidden = !article;

            const update = () => {
                if (article && progress && progressBar) {
                    const start = article.getBoundingClientRect().top + window.scrollY;
                    const end = start + article.offsetHeight - window.innerHeight;
                    const ratio = end <= start ? 1 : clamp((window.scrollY - start) / (end - start), 0, 1);
                    progressBar.style.transform = `scaleX(${ratio.toFixed(4)})`;
                }
                if (backToTop) {
                    const hasRoom = document.documentElement.scrollHeight > window.innerHeight * 1.45;
                    backToTop.hidden = !(hasRoom && window.scrollY > 620);
                }
            };

            const onScroll = () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    update();
                    ticking = false;
                });
            };
            window.addEventListener('scroll', onScroll, { passive: true, signal });
            window.addEventListener('resize', onScroll, { passive: true, signal });
            update();
        };

        const initProjectFilters = (signal) => {
            const panel = document.querySelector('[data-project-filters]');
            if (!panel) return;
            const cards = Array.from(document.querySelectorAll('[data-project-card]'));
            const input = panel.querySelector('[data-project-query]');
            const count = panel.querySelector('[data-project-visible-count]');
            const empty = document.querySelector('[data-project-filter-empty]');
            const state = { status: 'all', type: 'all', query: '' };

            const apply = () => {
                let visible = 0;
                cards.forEach((card) => {
                    const matchesStatus = state.status === 'all' || card.dataset.projectStatus === state.status;
                    const matchesType = state.type === 'all' || card.dataset.projectType === state.type;
                    const matchesQuery = !state.query || (card.dataset.projectSearch || '').includes(state.query);
                    const show = matchesStatus && matchesType && matchesQuery;
                    card.hidden = !show;
                    if (show) visible += 1;
                });
                if (count) count.textContent = String(visible);
                if (empty) empty.hidden = visible !== 0;
            };

            panel.querySelectorAll('[data-project-filter]').forEach((button) => {
                button.addEventListener('click', () => {
                    const group = button.dataset.projectFilter;
                    state[group] = button.dataset.filterValue;
                    panel.querySelectorAll(`[data-project-filter="${group}"]`).forEach((candidate) => {
                        const active = candidate === button;
                        candidate.classList.toggle('is-active', active);
                        candidate.setAttribute('aria-pressed', active ? 'true' : 'false');
                    });
                    apply();
                }, { signal });
            });
            if (input) {
                input.addEventListener('input', () => {
                    state.query = input.value.trim().toLocaleLowerCase();
                    apply();
                }, { signal });
            }
        };

        const initCodeCopy = (signal) => {
            document.querySelectorAll('.article-content div.highlight').forEach((highlight) => {
                if (highlight.querySelector('.copyCodeButton')) return;
                const code = highlight.querySelector('code[data-lang]');
                if (!code) return;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'copyCodeButton';
                button.textContent = currentLanguage() === 'zh-cn' ? '复制' : 'Copy';
                highlight.appendChild(button);
                button.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(code.textContent || '');
                        button.textContent = currentLanguage() === 'zh-cn' ? '已复制' : 'Copied!';
                        window.setTimeout(() => {
                            button.textContent = currentLanguage() === 'zh-cn' ? '复制' : 'Copy';
                        }, 1000);
                    } catch (error) {
                        console.warn('Unable to copy code', error);
                    }
                }, { signal });
            });
        };

        const initVisitCounter = () => {
            const counter = document.querySelector('[data-site-visits]');
            const value = counter?.querySelector('[data-site-visit-count]');
            if (!counter || !value) return;

            counter.dataset.state = 'loading';
            if (!visitCountRequest) {
                visitCountRequest = fetch(counter.dataset.countEndpoint, {
                    headers: { Accept: 'application/json' },
                    mode: 'cors'
                }).then((response) => {
                    if (!response.ok) throw new Error(`Visit counter returned ${response.status}`);
                    return response.json();
                }).then((data) => {
                    if (typeof data.count !== 'string' && typeof data.count !== 'number') {
                        throw new Error('Visit counter response is missing count');
                    }
                    return String(data.count);
                });
            }

            visitCountRequest.then((count) => {
                value.textContent = count;
                value.removeAttribute('aria-label');
                counter.dataset.state = 'ready';
            }).catch((error) => {
                value.textContent = '—';
                value.setAttribute('aria-label', counter.dataset.countUnavailable || 'Visit count unavailable');
                counter.dataset.state = 'unavailable';
                console.warn('Unable to load public visit count', error);
            });
        };

        const initPageFeatures = ({ softNavigation = false } = {}) => {
            if (pageController) pageController.abort();
            pageController = new AbortController();
            const { signal } = pageController;
            initOutline(signal);
            initReadingTools(signal);
            initProjectFilters(signal);
            initVisitCounter();
            if (softNavigation) {
                bindSoftThemeToggle();
                initCodeCopy(signal);
            }
        };

        const normalizeSearchText = (value) => (value || '')
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLocaleLowerCase()
            .trim();

        const getSearchState = (dialog) => {
            if (!dialog.__searchState) dialog.__searchState = { items: [], selected: -1, query: '' };
            return dialog.__searchState;
        };

        const sectionLabel = (section, language) => {
            const labels = language === 'zh-cn'
                ? { post: '文章', projects: '项目', reading: '读书笔记', page: '页面' }
                : { post: 'Post', projects: 'Project', reading: 'Reading', page: 'Page' };
            return labels[section] || section;
        };

        const loadSearchIndex = async (dialog) => {
            const indexURL = new URL(dialog.dataset.searchIndex, window.location.href).href;
            if (!searchCache.has(indexURL)) {
                searchCache.set(indexURL, fetch(indexURL, { headers: { Accept: 'application/json' } })
                    .then((response) => {
                        if (!response.ok) throw new Error(`Search index returned ${response.status}`);
                        return response.json();
                    })
                    .then((data) => Array.isArray(data.items) ? data.items : [])
                    .catch((error) => {
                        searchCache.delete(indexURL);
                        throw error;
                    }));
            }
            return searchCache.get(indexURL);
        };

        const renderSearch = (dialog) => {
            if (!dialog) return;
            const input = dialog.querySelector('[data-site-search-input]');
            const results = dialog.querySelector('[data-site-search-results]');
            const status = dialog.querySelector('[data-site-search-status]');
            const state = getSearchState(dialog);
            if (!input || !results || !status) return;

            const query = normalizeSearchText(input.value);
            const tokens = query.split(/\s+/).filter(Boolean);
            const ranked = state.items.map((item) => {
                const title = normalizeSearchText(item.title);
                const tags = normalizeSearchText((item.tags || []).join(' '));
                const description = normalizeSearchText(item.description);
                const haystack = `${title} ${tags} ${description} ${normalizeSearchText(item.section)}`;
                if (tokens.length && !tokens.every((token) => haystack.includes(token))) return null;
                let score = 0;
                if (query) {
                    if (title === query) score += 120;
                    else if (title.startsWith(query)) score += 80;
                    else if (title.includes(query)) score += 55;
                    if (tags.includes(query)) score += 28;
                    if (description.includes(query)) score += 14;
                }
                return { item, score };
            }).filter(Boolean)
                .sort((a, b) => b.score - a.score || String(b.item.date).localeCompare(String(a.item.date)))
                .slice(0, 9);

            state.query = query;
            state.selected = ranked.length ? 0 : -1;
            results.replaceChildren();
            if (!ranked.length) {
                status.textContent = query ? dialog.dataset.searchEmpty : dialog.dataset.searchIdle;
                return;
            }

            status.textContent = query
                ? (dialog.dataset.searchLanguage === 'zh-cn' ? `找到 ${ranked.length} 条结果` : `${ranked.length} result${ranked.length === 1 ? '' : 's'}`)
                : (dialog.dataset.searchLanguage === 'zh-cn' ? '最近内容' : 'Recent content');

            const fragment = document.createDocumentFragment();
            ranked.forEach(({ item }, index) => {
                const row = document.createElement('li');
                row.className = `site-search-result${index === state.selected ? ' is-selected' : ''}`;
                const link = document.createElement('a');
                link.href = item.url;
                link.dataset.searchResult = '';
                const title = document.createElement('strong');
                title.textContent = item.title;
                const type = document.createElement('small');
                type.textContent = sectionLabel(item.section, dialog.dataset.searchLanguage);
                const description = document.createElement('p');
                description.textContent = item.description || '';
                link.append(title, type, description);
                row.appendChild(link);
                fragment.appendChild(row);
            });
            results.appendChild(fragment);
        };

        const setSearchSelection = (dialog, nextIndex) => {
            const rows = Array.from(dialog.querySelectorAll('.site-search-result'));
            if (!rows.length) return;
            const state = getSearchState(dialog);
            state.selected = (nextIndex + rows.length) % rows.length;
            rows.forEach((row, index) => row.classList.toggle('is-selected', index === state.selected));
            rows[state.selected].querySelector('a')?.scrollIntoView({ block: 'nearest' });
        };

        const openSearch = async () => {
            const dialog = document.getElementById('site-search-dialog');
            if (!dialog) return;
            if (!dialog.open) dialog.showModal();
            const input = dialog.querySelector('[data-site-search-input]');
            requestAnimationFrame(() => input?.focus());
            try {
                const state = getSearchState(dialog);
                state.items = await loadSearchIndex(dialog);
                renderSearch(dialog);
            } catch (error) {
                const status = dialog.querySelector('[data-site-search-status]');
                if (status) status.textContent = currentLanguage() === 'zh-cn' ? '搜索索引加载失败' : 'Unable to load search index';
                console.warn('Unable to load search index', error);
            }
        };

        const closeSearch = () => {
            const dialog = document.getElementById('site-search-dialog');
            if (dialog?.open) dialog.close();
        };

        const isEditableTarget = (target) => target instanceof HTMLElement &&
            (target.matches('input, textarea, select') || target.isContentEditable);

        const pageKey = (url) => {
            const key = new URL(url, window.location.href);
            key.hash = '';
            return key.href;
        };

        const isSoftNavigableURL = (url) => {
            if (url.origin !== window.location.origin) return false;
            if (!url.pathname.startsWith(siteRoot.pathname)) return false;
            return !/\.(?:xml|json|pdf|zip|png|jpe?g|gif|webp|svg|ico)$/i.test(url.pathname);
        };

        const getPageDocument = async (url) => {
            const key = pageKey(url);
            if (!pageCache.has(key)) {
                const request = fetch(key, { headers: { Accept: 'text/html', 'X-Requested-With': 'LineeSoftNavigation' } })
                    .then((response) => {
                        if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) {
                            throw new Error(`Navigation returned ${response.status}`);
                        }
                        return response.text();
                    })
                    .then((html) => new DOMParser().parseFromString(html, 'text/html'))
                    .catch((error) => {
                        pageCache.delete(key);
                        throw error;
                    });
                pageCache.set(key, request);
                if (pageCache.size > 12) pageCache.delete(pageCache.keys().next().value);
            }
            return pageCache.get(key);
        };

        const syncHead = (nextDocument) => {
            document.title = nextDocument.title;
            ['meta[name="description"]', 'link[rel="canonical"]'].forEach((selector) => {
                const current = document.head.querySelector(selector);
                const next = nextDocument.head.querySelector(selector);
                if (current && next) {
                    Array.from(next.attributes).forEach((attribute) => current.setAttribute(attribute.name, attribute.value));
                }
            });
        };

        const restoreScroll = (url, scrollY = 0) => {
            requestAnimationFrame(() => {
                const targetId = decodeURIComponent(url.hash.replace(/^#/, ''));
                const target = targetId ? document.getElementById(targetId) : null;
                if (target) target.scrollIntoView({ block: 'start' });
                else window.scrollTo({ top: scrollY, left: 0, behavior: 'auto' });
            });
        };

        const trackPageView = () => {
            if (window.goatcounter?.count) {
                window.goatcounter.count({
                    path: window.location.pathname + window.location.search,
                    title: document.title
                });
            }
        };

        const navigate = async (destination, { historyMode = 'push', scrollY = 0 } = {}) => {
            const url = new URL(destination, window.location.href);
            if (!isSoftNavigableURL(url)) {
                window.location.assign(url.href);
                return;
            }

            const sequence = ++navigationSequence;
            closeSearch();
            closeMobileDrawer();
            closeLanguageMenus();
            document.body.classList.add('is-soft-navigating');
            if (historyMode === 'push') {
                history.replaceState({ ...(history.state || {}), softNavigation: true, scrollY: window.scrollY }, '', window.location.href);
            }

            try {
                const nextDocument = await getPageDocument(url);
                if (sequence !== navigationSequence) return;
                const currentContainer = document.querySelector('.main-container');
                const nextContainer = nextDocument.querySelector('.main-container');
                const currentUtility = document.getElementById('site-utility-layer');
                const nextUtility = nextDocument.getElementById('site-utility-layer');
                if (!currentContainer || !nextContainer || !currentUtility || !nextUtility) throw new Error('Navigation shell missing');

                const currentPhoto = currentContainer.querySelector('.left-profile-photo');
                const nextPhoto = nextContainer.querySelector('.left-profile-photo');
                if (currentPhoto && nextPhoto && currentPhoto.getAttribute('src') === nextPhoto.getAttribute('src')) {
                    nextPhoto.replaceWith(currentPhoto);
                }

                syncHead(nextDocument);
                document.documentElement.lang = nextDocument.documentElement.lang;
                document.documentElement.dir = nextDocument.documentElement.dir;
                document.body.className = nextDocument.body.className;
                currentContainer.replaceWith(nextContainer);
                currentUtility.replaceWith(nextUtility);
                if (historyMode === 'push') history.pushState({ softNavigation: true, scrollY: 0 }, '', url.href);
                initPageFeatures({ softNavigation: true });
                restoreScroll(url, scrollY);
                trackPageView();
                window.dispatchEvent(new CustomEvent('linee:navigation', { detail: { url: url.href } }));
            } catch (error) {
                console.warn('Soft navigation failed; falling back to a full page load.', error);
                window.location.assign(url.href);
            } finally {
                if (sequence === navigationSequence) document.body.classList.remove('is-soft-navigating');
            }
        };

        const initNetwork = () => {
            if (reducedMotion || !motionProfile.enableNetwork || document.querySelector('.bg-network-canvas')) return;
            const canvas = document.createElement('canvas');
            canvas.className = 'bg-network-canvas';
            canvas.setAttribute('aria-hidden', 'true');
            document.body.prepend(canvas);
            const context = canvas.getContext('2d');
            if (!context) return;

            const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
            const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            let width = 0;
            let height = 0;
            let points = [];
            let frame = 0;

            const createPoints = () => {
                const baseCount = window.innerWidth > 1200 ? 72 : (window.innerWidth > 800 ? 54 : 38);
                const count = Math.max(14, Math.round(baseCount * motionProfile.pointCountScale));
                points = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    depth: 0.3 + Math.random() * 0.8
                }));
            };

            const resize = () => {
                const nextWidth = window.innerWidth;
                const nextHeight = window.innerHeight;
                const shouldRebuild = !points.length || Math.abs(nextWidth - width) > 80 || Math.abs(nextHeight - height) > 80;
                width = nextWidth;
                height = nextHeight;
                canvas.width = Math.floor(width * dpr());
                canvas.height = Math.floor(height * dpr());
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                context.setTransform(dpr(), 0, 0, dpr(), 0, 0);
                if (shouldRebuild) createPoints();
            };

            const color = (property, fallback) => getComputedStyle(document.documentElement).getPropertyValue(property).trim() || fallback;
            const draw = () => {
                context.clearRect(0, 0, width, height);
                const offsetX = (pointer.x - width / 2) * motionProfile.offsetFactor;
                const offsetY = (pointer.y - height / 2) * motionProfile.offsetFactor;
                const lineRGB = color('--network-line-rgb', '15, 108, 255');
                const pointRGB = color('--network-point-rgb', '0, 122, 255');

                points.forEach((point) => {
                    point.x += point.vx;
                    point.y += point.vy;
                    if (point.x < -20 || point.x > width + 20) point.vx *= -1;
                    if (point.y < -20 || point.y > height + 20) point.vy *= -1;
                });

                for (let index = 0; index < points.length; index += 1) {
                    const first = points[index];
                    const x1 = first.x + offsetX * first.depth;
                    const y1 = first.y + offsetY * first.depth;
                    for (let nextIndex = index + 1; nextIndex < points.length; nextIndex += 1) {
                        const second = points[nextIndex];
                        const x2 = second.x + offsetX * second.depth;
                        const y2 = second.y + offsetY * second.depth;
                        const distance = Math.hypot(x1 - x2, y1 - y2);
                        if (distance >= motionProfile.linkDistance) continue;
                        const alpha = (1 - distance / motionProfile.linkDistance) * motionProfile.linkAlpha;
                        context.strokeStyle = `rgba(${lineRGB}, ${alpha.toFixed(3)})`;
                        context.lineWidth = motionProfile.lineWidth;
                        context.beginPath();
                        context.moveTo(x1, y1);
                        context.lineTo(x2, y2);
                        context.stroke();
                    }
                    context.fillStyle = `rgba(${pointRGB}, ${motionProfile.pointAlpha})`;
                    context.beginPath();
                    context.arc(x1, y1, motionProfile.pointRadius, 0, Math.PI * 2);
                    context.fill();
                }
                frame = requestAnimationFrame(draw);
            };

            window.addEventListener('resize', resize, { passive: true });
            window.addEventListener('pointermove', (event) => {
